# ai-dev-baseline — per-project agent role manifest.
#
# Drop this file at your repo root and set who does what for THIS project, then
# run `agent-init`. Any role you leave unset falls back to your global default
# manifest, then to the built-in default (see docs/roles-and-agents.md).
#
# Agent tokens: claude | codex | gemini

[roles]
primary      = "claude"     # drives /implement-issue. Exactly one agent.
gap_analysis = "codex"      # pre-implementation adversarial pass. "" to skip.
review       = ["codex"]    # code review before merge. 1+ agents; more = better.
                            # PREFER AN AGENT THAT IS NOT `primary`. A reviewer that is the same
                            # model as the implementer is that model checking its own work, which
                            # is the weakest review a manifest can express — and Anthropic's Opus 5
                            # guidance asks explicitly that Claude not be told to double-check
                            # itself, while OpenAI's asks Codex for exactly the named-checklist
                            # pass this slot runs (#211). /implement-issue still runs a same-agent
                            # slot, and says out loud that it is not independent.
                            # NO CODEX INSTALLED? Nothing breaks and nothing is faked: step 8
                            # reports the rung it is on and moves on. Declare `[reviewers] bots`
                            # below and the PR-layer guard still withholds /implement-issue's OWN
                            # auto-merge arm until your async reviewer has seen the head commit.
                            # That is not branch protection: GitHub does not enforce the
                            # declaration, so a manual merge is still a manual merge.
debug        = "claude"     # owns root-cause investigations.

# Optional: reasoning effort per dispatched role (#225). DECLARED, not inherited.
#
# Without this, every cross-agent dispatch runs at whatever the agent's own config says — so a
# workstation carrying `model_reasoning_effort = "xhigh"` in ~/.codex/config.toml silently applied
# it to gap-analysis and review alike. One measured review took 37m57s of a 2h28m run. A value the
# operator never chose for THIS workflow should not govern a step the workflow blocks on.
#
# Values: "minimal" | "low" | "medium" | "high" | "xhigh" (an invalid one is a hard error, never a
# silent fall-through). Unset → the agent's own config governs, exactly as before.
# An explicit "" also means inherit, matching how [gates] spells "leave this alone".
#
# Only `review` has a built-in default (`medium`): its job is a named-checklist pass over a diff
# that is already written, which is not the shape that needs the deepest setting — and a reviewer
# nobody waits for is a reviewer that gets deleted. Raise it if your reviews start missing things.
#
# Codex honours this via `codex exec -c model_reasoning_effort=…`. The Antigravity CLI has no
# equivalent override, so the setting is accepted and ignored for `gemini` slots rather than
# pretending to bound them.
# [roles.effort]
# review       = "medium"
# gap_analysis = "high"
# issue_author = "claude"   # defaults to `primary` if unset
# release      = "claude"   # defaults to `primary` if unset. Names WHO cuts a release — it
#                           # installs no release skill; write your own project-scoped
#                           # `/release` and have it resolve this role. See docs/roles-and-agents.md

# Optional: async external-bot reviewers — GitHub App logins that post review threads AFTER
# the PR opens (distinct from the in-session `review` role above). `/resolve-pr-threads`
# auto-resolves ONLY threads authored by a login in this allowlist — an EXACT login match,
# never a `[bot]`-suffix heuristic, so an unlisted account is never touched.
#
# THE TWO CONSUMERS OF THIS KEY DO NOT HAVE THE SAME SAFETY PROPERTY, so pick a spelling with the
# one you care about in mind:
#   * the MERGE GUARDS match asymmetrically — a bare `foo` accepts `foo` or `foo[bot]` (portable
#     across GitHub's two spellings), `foo[bot]` accepts only the suffixed form;
#   * `/resolve-pr-threads` matches the login EXACTLY, so a BARE entry resolves threads from
#     whatever account bears that login — including a human. That is not hypothetical: `gh api
#     users/gemini-code-assist` returns a real User account. Whether the bare defaults should be
#     dropped is tracked in #208.
# So: bare is the portable spelling for arming, and the `[bot]` form is the safer one for
# auto-resolution. Declaring both spellings of one account is fine — the guards treat them as one
# reviewer.
#   unset → the built-in default set of common review bots (Codex connector, Gemini, Copilot,
#           github-actions, Claude) — see base/roles.md
#   []    → disable bot-thread auto-resolution entirely
#
# WORTH SETTING EVEN IF YOU NEVER USE /resolve-pr-threads (#134). This key also decides whether
# `/implement-issue` may arm `gh pr merge --auto`: it will not, until every login listed here has
# reviewed the PR's CURRENT head commit. GitHub itself cannot enforce that — auto-merge fires when
# the required CHECKS pass, and a bot reviewer is not a check, so a PR can (and did) merge minutes
# before its reviewer spoke.
#   declared → wait for these reviewers before arming
#   []       → this repo has NO async reviewer; keep unattended auto-merge
#   unset    → UNKNOWN, so the guard fails closed and does not arm. If nothing reviews your PRs,
#              set `bots = []` to get unattended merging back.
# SPELLING: prefer the BARE login. GitHub reports the same App as `foo` (GraphQL) or `foo[bot]`
# (REST), and the guard normalizes that suffix ONE WAY — the API login toward your declaration:
#   `foo`      matches `foo` OR `foo[bot]`  — portable across both APIs; recommended
#   `foo[bot]` matches `foo[bot]` ONLY      — that App exactly, so a human named `foo` cannot
#                                             satisfy it (the reason the match is asymmetric)
# See docs/roles-and-agents.md.
# [reviewers]
# bots = ["chatgpt-codex-connector", "gemini-code-assist", "copilot"]

# Optional: override the auto-detected quality gates for this repo. The gate
# runner auto-detects pnpm/npm/yarn/bun, cargo, go, and python projects; set
# these only when detection is wrong or the repo needs specific commands.
# An empty string disables that gate. Gates are an OPEN SET — any extra key
# (e.g. build, guards) becomes a first-class gate that blocks like the four.
[gates]
# typecheck = "pnpm typecheck"
# lint      = "pnpm lint"
# test      = "pnpm test"
# format    = "pnpm format:check"
# build     = "pnpm build"          # a custom gate — blocks like the built-in four

# Optional: declare a gate explicitly Not-Applicable (reported, never a failure
# or a detection miss) — e.g. a stdlib-only tool with no linter/type-checker.
# [gates.state]
# lint      = "na"
# typecheck = "na"

# Optional: how the INSTALLED baseline keeps itself current (issues #36, #139).
#
# GLOBAL ONLY — read from ~/.config/ai-dev-baseline/agents.toml and NOWHERE else. A copy of
# this key in a PROJECT's agents.toml is ignored on purpose: whether your global tooling
# updates itself must not depend on which repo you happened to open.
#
# TWO TRIGGERS, ONE SETTING. This key governs both, and `off` disables both:
#   1. a Claude SessionStart hook, on `startup` only (#36);
#   2. the last step of `/cleanup`, on every agent (#139) — because `/cleanup` runs right after
#      a merge, when the install goes stale, and right before `/clear`, which trigger 1 skips.
#
#   auto   (default) fast-forwards the install-source clone and re-runs the idempotent install,
#          then reports one line naming what changed. It refuses a dirty / mid-rebase /
#          detached / non-default / ahead / diverged clone, and never touches the clone the
#          caller is working in.
#   notify the same check, but it reports ONLY "behind" — every other state stays silent, so a
#          clone you deliberately parked on a branch never nags. You run `baseline update`.
#          Precisely: notify never changes the working tree or the installed payload (it does
#          still fetch remote-tracking refs, which is what makes the answer true, not remembered).
#   off    neither trigger does anything.
#
# ADB_SESSION_UPDATE overrides this for one run. ADB_SESSION_UPDATE_INTERVAL_SECS (default 600,
# 0 = every session) bounds how often the SessionStart check re-runs; `/cleanup` deliberately
# ignores that interval — an explicitly requested check must not be suppressed at the exact
# moment a merge just made the clone stale — while still refreshing the shared stamp.
#
# The key name is historical: it predates the second trigger. It is kept for backward
# compatibility, so an existing `off` keeps meaning off.
# [updates]
# session_start = "auto"

# Optional: scope a gate to a changed-files condition. Comma-separated globs;
# "*" matches across "/". A scoped gate runs only when the change set (supplied
# by the Stop-hook) touches a matching path — no forked gate script needed.
# [gates.scope]
# build = "apps/**,packages/**"
