name: CI

# WHY `push:` IS FILTERED AND `pull_request:` IS NOT (#165, #99).  adb-claim-ok: #99 was closed NOT_PLANNED as SUPERSEDED by #165, which absorbed it; the reference is this change's provenance, not tracked work
#
# Both triggers unfiltered meant a same-repo branch fired BOTH events for one head SHA, so every
# job ran TWICE. Measured live on PR #296: `gh pr checks` reported `total=54 distinct=27` — 27 jobs,
# 54 check runs. Branch protection matches by context NAME so it still gated correctly; the cost was
# a straight doubling of CI minutes on every push, plus an ambiguous "which run satisfied the
# requirement".
#
# Narrowing `push:` to the default branch does NOT perturb check discovery, and that is load-bearing
# rather than lucky: `_adb_rs_file_verdict` inspects only `pull_request`/`pull_request_target`
# triggers, so a `push:` filter is invisible to it. Verified by running the real discovery over a
# before/after pair — 27 contexts either way, byte-identical. Fork PRs are unaffected because
# `on: push` never fires for a fork's branch in this repo.
#
# ONE THING IT DOES CHANGE, and it is not "zero risk": `branches:` excludes TAG pushes, so pushing a
# `v*` tag no longer runs this file. Safe here, but for a narrower reason than "the release verifies
# first": NOTHING EVER READ A TAG'S CHECK RUNS. `/release` settles and health-checks the MERGE COMMIT
# (`release.sh verify-merge`), and `cmd_tag` then tags that same sha — so the evidence comes from the
# push-to-`main` run, which still happens. (`cmd_tag` requires only VERSION and MERGE_SHA, so an
# operator CAN reach it without running `verify-merge`; that was already true, and a tag-triggered
# `ci.yml` run would not have gated it either, because no step consumed one.) `wsl-smoke.yml`
# independently keeps its own `push: tags: ['v*']`, so the Windows leg still fires on a release.
#
# `main` is spelled literally because GitHub does not evaluate expressions in `on:`. If this repo's
# default branch is ever renamed, this line has to move with it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Install shellcheck
        # Preinstalled on ubuntu-26.04 (0.11.0-2), but install explicitly so this
        # job doesn't silently depend on runner-image contents.
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck over every tracked shell file
        run: |
          set -uo pipefail
          # Enumerate tracked shell files instead of hardcoding a file list, so
          # a not-yet-present agents/*/adapter.sh is picked up automatically
          # once it lands (and never fails this step by being globbed while
          # absent). The bin/ commands have no .sh extension, so they're named
          # explicitly alongside the *.sh glob.
          mapfile -t files < <(git ls-files '*.sh' 'bin/agent-init' 'bin/baseline')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no tracked shell files found via 'git ls-files'"
            exit 1
          fi
          echo "Linting ${#files[@]} shell file(s):"
          printf '  %s\n' "${files[@]}"

          # SC1091 ("not following sourced files") is expected: precommit-gate.sh
          # and implement-issue-gate.sh source lib/project-gates.sh via a
          # dynamically resolved relative path shellcheck can't statically follow.
          #
          # --severity=warning drops style/info-level nits (shellcheck's lowest
          # two tiers, e.g. SC2015/SC2016/SC2295-class suggestions) so this gate
          # fails on real correctness findings (warning/error), not style.
          shellcheck --severity=warning -e SC1091 "${files[@]}"

      # The RUNNER that dispatches every other job's local counterpart is itself a guard now (#260),
      # so it gets the treatment guards get here: a deliberately failing step must be observed still
      # failing the run under parallelism, attributed to the right name.
      #
      # A STEP on this job, deliberately NOT a job of its own — the same reasoning the bash-floor
      # lint records under `repo-settings` below: a new job is a newly added non-required context,
      # which is exactly the drift `required-drift` exists to flag, and adding one costs the owner a
      # branch-protection change. This job is the natural host: it is the one whose charter is the
      # tracked shell suite as a whole rather than one library in it.
      - name: The selfcheck runner must be observed failing on a red step under parallelism (#260)
        run: bash scripts/check-selfcheck.sh

  build-drift:
    name: build-drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Rebuild generated root docs and skills
        run: bash scripts/build.sh

      - name: Fail if generated docs or skills are out of date
        run: |
          set -uo pipefail
          rc=0

          # Root docs (agents/*/…): rendered from base/practices/*.md.
          if ! git diff --exit-code -- agents/claude/CLAUDE.md agents/codex/AGENTS.md agents/gemini/GEMINI.md; then
            echo "::error::agents/claude/CLAUDE.md, agents/codex/AGENTS.md, and/or agents/gemini/GEMINI.md are stale relative to base/practices/*.md. Run 'bash scripts/build.sh' locally and commit the regenerated file(s)."
            rc=1
          fi

          # Generated skills: base/workflows/*.md renders into EVERY agent's skills tree
          # (Claude, Codex, Gemini). git diff catches a modified tracked SKILL.md;
          # git ls-files --others catches a newly-rendered skill that was never committed
          # (git diff is blind to untracked files — the drift a rebuild-forgot most often
          # produces). 1:1 both ways so nothing silently loses or orphans an artifact.
          for agent in claude codex gemini; do
            tree="agents/$agent/skills"
            if ! git diff --exit-code -- "$tree"; then
              echo "::error::$tree/*/SKILL.md is stale relative to base/workflows/*.md. Run 'bash scripts/build.sh' locally and commit the regenerated file(s)."
              rc=1
            fi
            untracked="$(git ls-files --others --exclude-standard -- "$tree")"
            if [ -n "$untracked" ]; then
              echo "::error::rendered $agent skill(s) were produced but not committed:"
              echo "$untracked"
              rc=1
            fi
            for wf in base/workflows/*.md; do
              [ -e "$wf" ] || continue
              n="$(basename "$wf" .md)"
              [ "$n" = README ] && continue
              sk="$tree/$n/SKILL.md"
              if [ ! -f "$sk" ]; then
                echo "::error::base/workflows/$n.md has no rendered skill at $sk"
                rc=1
              elif ! git ls-files --error-unmatch "$sk" >/dev/null 2>&1; then
                # Gitignore-immune: git ls-files --others (above) respects .gitignore, so
                # a rendered skill under an ignored path would slip past it. A tracked
                # check catches an ignored-and-uncommitted skill too.
                echo "::error::$sk exists but is not git-tracked (untracked or gitignored) — run 'bash scripts/build.sh' and commit it"
                rc=1
              fi
            done
            for sk in "$tree"/*/SKILL.md; do
              [ -e "$sk" ] || continue
              n="$(basename "$(dirname "$sk")")"
              if [ ! -f "base/workflows/$n.md" ]; then
                echo "::error::$agent skill '$n' has no source at base/workflows/$n.md (orphaned generated artifact)"
                rc=1
              fi
            done
          done

          exit "$rc"

      # The step above proves the artifacts MATCH; this proves the WRITE that produced them cannot
      # tear. It rides this job rather than taking one of its own for the reason the workflow-render
      # job states: a new job is a new branch-protection context, which `required-drift` then reports
      # as a discovered job gating nothing until someone edits protection by hand. It runs a copied
      # build.sh in a `mktemp -d` fixture and never touches this checkout, so ordering after the
      # drift comparison is safe.
      - name: A failed render must not truncate the tracked file it was writing (#268)
        run: bash scripts/check-build-atomic.sh

  skill-frontmatter:
    name: skill-frontmatter
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Lint SKILL.md frontmatter
        run: |
          set -uo pipefail
          shopt -s nullglob
          fail=0
          # Required keys are agent-specific: every SKILL.md needs name + description;
          # only Claude's loader also requires user-invocable (Codex/Antigravity honor
          # only name + description — see base/workflows/README.md).
          for agent in claude codex gemini; do
            case "$agent" in
              claude) keys='name: description: user-invocable:' ;;
              *)      keys='name: description:' ;;
            esac
            for f in agents/$agent/skills/*/SKILL.md; do
              first_line="$(head -n1 "$f")"
              if [ "$first_line" != "---" ]; then
                echo "::error file=$f::does not start with a '---' YAML frontmatter delimiter"
                fail=1
                continue
              fi

              # Line number of the SECOND '---' (the block's closing delimiter).
              # '|| true' keeps a malformed file (no closing delimiter) from
              # tripping the job's default errexit before the check below can
              # report it cleanly.
              close_line="$(grep -n '^---$' "$f" | sed -n '2p' | cut -d: -f1)" || true
              if [ -z "$close_line" ]; then
                echo "::error file=$f::missing closing '---' for the frontmatter block"
                fail=1
                continue
              fi

              frontmatter="$(sed -n "2,$((close_line - 1))p" "$f")"
              for key in $keys; do
                if ! printf '%s\n' "$frontmatter" | grep -q "^${key}"; then
                  echo "::error file=$f::frontmatter is missing required key '${key}'"
                  fail=1
                fi
              done
            done
          done
          exit "$fail"

  workflow-render:
    name: workflow-render
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Workflow body placeholders map to Claude tokens, body-only, fail-loud on unmapped (#16)
        run: bash scripts/check-workflow-render.sh

      # Same species as the step above (a lint over the same workflow bodies, ~50ms), so it rides
      # this job rather than spending a whole runner on it.
      - name: No fenced workflow block may assign a zsh-special variable name (#126)
        run: bash scripts/check-workflow-shell.sh

      # Third species, same bodies, same reason it is a STEP and not a job: a new job becomes a new
      # branch-protection context, which `required-drift` then reports as a discovered job gating
      # nothing until someone edits protection by hand. Riding an existing required job keeps the
      # gate real from the first run.
      - name: Untrusted third-party text is labelled at every read site and contained at every hand-off (#214)
        run: bash scripts/check-injection.sh

      # Fourth species, and it rides this job for the same reason as the two above: a new job is a
      # new branch-protection context that `required-drift` then reports as gating nothing until
      # someone edits protection by hand. It reads the same workflow bodies plus their renders.
      - name: Run data lands on a per-checkout path, never a fixed shared-temp one (#250)
        run: bash scripts/check-tmp-paths.sh

      # Fifth species, riding this job for the SAME branch-protection reason the three above give.
      # It also belongs here on subject: it is the second thing `build.sh` now does per agent,
      # beside the placeholder MAP the first step covers.
      #
      # It is the slowest step in this job — it runs the real `build.sh` over a couple of dozen
      # throwaway fixtures, where the others are single-pass lints. No figure is quoted, and that
      # is the rule rather than laziness: #335 was filed because a runtime copied into prose was
      # wrong by an order of magnitude by the time anyone read it, and D66 gives the live number
      # one dated home. The job's own timing output is the current answer.
      - name: Per-agent blocks vary instruction DENSITY and nothing else, on both render paths (#304)
        run: bash scripts/check-agent-blocks.sh

  gate-detector:
    name: gate-detector
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: repo-root detection surfaces the committed agents.toml gate
        run: |
          set -uo pipefail
          # The generic empty-ecosystem no-op (detect emits nothing) is covered by
          # check-gates.sh, run in this same job below — so it isn't repeated here. This step
          # asserts what is specific to THIS repo: the dogfooded agents.toml [gates] override
          # (#7) must keep being exercised, so CI can't silently stop testing the manifest.
          want="$(printf 'test\tbash scripts/selfcheck.sh')"
          got="$(bash scripts/lib/project-gates.sh detect . 2>/dev/null)"   # compare stdout only
          if [ "$got" != "$want" ]; then
            echo "::error::expected repo-root 'detect .' to emit the committed test gate; got: $got"
            exit 1
          fi

      - name: badcmd must exit non-zero (usage guard)
        run: |
          set -uo pipefail
          rc=0
          bash scripts/lib/project-gates.sh badcmd >/tmp/adb-badcmd.log 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::'project-gates.sh badcmd' unexpectedly exited 0; expected a non-zero usage-error exit"
            cat /tmp/adb-badcmd.log
            exit 1
          fi

      - name: Install jq
        # jq drives exact package.json script detection; install it explicitly (rather
        # than lean on runner-image contents) so the jq-path tests actually exercise it.
        run: sudo apt-get install -y jq

      - name: Full gate-model behavior tests (detection, open set, N/A, path scope)
        run: bash scripts/check-gates.sh

  common-lib:
    name: common-lib
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Unit-test the shared shell primitives (incl. adb_repo_shape, #23)
        run: bash scripts/check-common-lib.sh

      # ...and the install-manifest guards are guards, so every rule is injected with its own defect
      # and must make the suite go red ON ITS OWN NAMED WITNESS (#324). Red for the wrong reason is
      # not evidence — and a mutation whose edit silently fails to apply reports itself observed
      # while having checked nothing, which is the failure this mode was built after hitting.
      #
      # THIS STEP RIDES THE EXISTING JOB rather than adding one, for the reason the `adopt` job
      # states: a second job is a second required status context for branch protection to grow, and
      # this split does not earn one.
      - name: ...and the manifest guards must be able to fail — 8 mutations, each observed RED (#324)
        run: bash scripts/check-common-lib.sh --mutation

  agent-init:
    name: agent-init
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: agent-init repo-shape tolerance — subdir, untracked parent, nested, non-git (#23)
        run: bash scripts/check-agent-init.sh

  role-dispatch:
    name: role-dispatch
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Unit-test the runtime role-dispatch helper (#15)
        run: bash scripts/check-role-dispatch.sh

  pr-review:
    name: pr-review
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Unit-test the pre-arm review guard (#134)
        run: bash scripts/check-pr-review.sh

      # Rides THIS job rather than taking its own, for the reason stated on the repo-settings job:
      # a new job is a newly added non-required context, which is the drift `required-drift` exists
      # to flag. This job is the natural host — it is the other stub-backed suite over a live
      # GitHub-state predicate, and `ci-health` answers the question that sits next to "has review
      # happened?": did the run that reported this state actually execute anything (#300)?
      - name: Unit-test the CI-run classifier — did this run actually execute? (#300)
        run: bash scripts/check-ci-health.sh

  pr-watch:
    name: pr-watch
    runs-on: ubuntu-26.04
    # 25, not 10, because the mutation step below runs the whole suite once per row plus a control.
    # Measured: 2m27s at this workstation's pool width, 3m36s with the pool forced to 2 — which is
    # what a 2-core hosted runner gets — before that runner's own slower CPU is counted. A job that
    # times out is a red CI leg that says nothing about the diff, which is the class of defect #394
    # is about.
    timeout-minutes: 25
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Unit-test the async-reviewer status detector (#49)
        run: bash scripts/check-pr-watch.sh

      # ...and the bounded-wait cases are guards whose failure mode is SILENCE (#394), so each is
      # injected with its own defect and must make the suite go red ON ITS OWN NAMED WITNESS.
      #
      # THIS STEP RIDES THE EXISTING JOB rather than adding one, for the reason `common-lib` states:
      # a second job is a second required status context for branch protection to grow, and this
      # split does not earn one. It runs HERE and not only inside `selfcheck-macos`, because that
      # aggregate job is macOS: without this step every witness could regress on Linux unseen.
      - name: ...and those cases must be able to fail — 7 mutations, each observed RED (#394)
        run: bash scripts/check-pr-watch.sh --mutation

      # The resolver's own predicates ride this job for the same reason the mutation step above
      # does: a second job is a second required status context for branch protection to grow, and
      # `pr-threads.sh` is the sibling half of the same PR-review loop — pr-watch answers "is the
      # reviewer done?", pr-threads answers "which threads are there?". One job, two libraries.
      - name: Unit-test the /resolve-pr-threads decision predicates (#416, #418)
        run: bash scripts/check-pr-threads.sh

      # ...and the completeness proof must be able to fail (#418). Its failure mode is SILENCE: the
      # shipped defect printed exactly what a clean run prints.
      - name: ...and that proof must be able to fail — 4 mutations, each observed RED (#418)
        run: bash scripts/check-pr-threads.sh --mutation

  state-assert:
    name: state-assert
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
