      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Install jq
        # The hook emits its one line as structured JSON, and the test asserts on it.
        run: sudo apt-get install -y jq

      - name: SessionStart currency hook — source gate, two-clone split, safety, wiring (#36)
        run: bash scripts/check-session-currency.sh

  precommit-gate:
    name: precommit-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Install jq
        # The precommit gate parses the /implement-issue run marker with jq to answer "does
        # another session own this branch?" (#241), and the suite's ownership fixtures build
        # markers the same way. Without jq the gate answers "unknown" and enforces — so a
        # missing jq would not fail the job, it would quietly stop exercising the ownership
        # path, which is the fail-silent shape this repo lints against. Installed explicitly,
        # exactly as the implement-gate job already does.
        run: sudo apt-get install -y jq

      - name: Stop-hook quality gate must fail loud on a missing library (#35)
        run: bash scripts/check-precommit-gate.sh

  implement-gate:
    name: implement-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
