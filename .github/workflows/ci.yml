name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        # Preinstalled on ubuntu-latest, but install explicitly so this job
        # doesn't silently depend on runner-image contents.
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck over every tracked shell file
        run: |
          set -uo pipefail
          # Enumerate tracked shell files instead of hardcoding a file list, so
          # a not-yet-present agents/*/adapter.sh is picked up automatically
          # once it lands (and never fails this step by being globbed while
          # absent). The bin/ commands have no .sh extension, so they're named
          # explicitly alongside the *.sh glob.
          mapfile -t files < <(git ls-files '*.sh' 'bin/agent-init' 'bin/baseline')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no tracked shell files found via 'git ls-files'"
            exit 1
          fi
          echo "Linting ${#files[@]} shell file(s):"
          printf '  %s\n' "${files[@]}"

          # SC1091 ("not following sourced files") is expected: precommit-gate.sh
          # and implement-issue-gate.sh source lib/project-gates.sh via a
          # dynamically resolved relative path shellcheck can't statically follow.
          #
          # --severity=warning drops style/info-level nits (shellcheck's lowest
          # two tiers, e.g. SC2015/SC2016/SC2295-class suggestions) so this gate
          # fails on real correctness findings (warning/error), not style.
          shellcheck --severity=warning -e SC1091 "${files[@]}"

  build-drift:
    name: build-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild generated root docs and skills
        run: bash scripts/build.sh

      - name: Fail if generated docs or skills are out of date
        run: |
          set -uo pipefail
          rc=0

          # Root docs (agents/*/…): rendered from base/practices/*.md.
          if ! git diff --exit-code -- agents/claude/CLAUDE.md agents/codex/AGENTS.md agents/gemini/GEMINI.md; then
            echo "::error::agents/claude/CLAUDE.md, agents/codex/AGENTS.md, and/or agents/gemini/GEMINI.md are stale relative to base/practices/*.md. Run 'bash scripts/build.sh' locally and commit the regenerated file(s)."
            rc=1
          fi

          # Generated skills: base/workflows/*.md renders into EVERY agent's skills tree
          # (Claude, Codex, Gemini). git diff catches a modified tracked SKILL.md;
          # git ls-files --others catches a newly-rendered skill that was never committed
          # (git diff is blind to untracked files — the drift a rebuild-forgot most often
          # produces). 1:1 both ways so nothing silently loses or orphans an artifact.
          for agent in claude codex gemini; do
            tree="agents/$agent/skills"
            if ! git diff --exit-code -- "$tree"; then
              echo "::error::$tree/*/SKILL.md is stale relative to base/workflows/*.md. Run 'bash scripts/build.sh' locally and commit the regenerated file(s)."
              rc=1
            fi
            untracked="$(git ls-files --others --exclude-standard -- "$tree")"
            if [ -n "$untracked" ]; then
              echo "::error::rendered $agent skill(s) were produced but not committed:"
              echo "$untracked"
              rc=1
            fi
            for wf in base/workflows/*.md; do
              [ -e "$wf" ] || continue
              n="$(basename "$wf" .md)"
              [ "$n" = README ] && continue
              sk="$tree/$n/SKILL.md"
              if [ ! -f "$sk" ]; then
                echo "::error::base/workflows/$n.md has no rendered skill at $sk"
                rc=1
              elif ! git ls-files --error-unmatch "$sk" >/dev/null 2>&1; then
                # Gitignore-immune: git ls-files --others (above) respects .gitignore, so
                # a rendered skill under an ignored path would slip past it. A tracked
                # check catches an ignored-and-uncommitted skill too.
                echo "::error::$sk exists but is not git-tracked (untracked or gitignored) — run 'bash scripts/build.sh' and commit it"
                rc=1
              fi
            done
            for sk in "$tree"/*/SKILL.md; do
              [ -e "$sk" ] || continue
              n="$(basename "$(dirname "$sk")")"
              if [ ! -f "base/workflows/$n.md" ]; then
                echo "::error::$agent skill '$n' has no source at base/workflows/$n.md (orphaned generated artifact)"
                rc=1
              fi
            done
          done

          exit "$rc"

  skill-frontmatter:
    name: skill-frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint SKILL.md frontmatter
        run: |
          set -uo pipefail
          shopt -s nullglob
          fail=0
          # Required keys are agent-specific: every SKILL.md needs name + description;
          # only Claude's loader also requires user-invocable (Codex/Antigravity honor
          # only name + description — see base/workflows/README.md).
          for agent in claude codex gemini; do
            case "$agent" in
              claude) keys='name: description: user-invocable:' ;;
              *)      keys='name: description:' ;;
            esac
            for f in agents/$agent/skills/*/SKILL.md; do
              first_line="$(head -n1 "$f")"
              if [ "$first_line" != "---" ]; then
                echo "::error file=$f::does not start with a '---' YAML frontmatter delimiter"
                fail=1
                continue
              fi

              # Line number of the SECOND '---' (the block's closing delimiter).
              # '|| true' keeps a malformed file (no closing delimiter) from
              # tripping the job's default errexit before the check below can
              # report it cleanly.
              close_line="$(grep -n '^---$' "$f" | sed -n '2p' | cut -d: -f1)" || true
              if [ -z "$close_line" ]; then
                echo "::error file=$f::missing closing '---' for the frontmatter block"
                fail=1
                continue
              fi

              frontmatter="$(sed -n "2,$((close_line - 1))p" "$f")"
              for key in $keys; do
                if ! printf '%s\n' "$frontmatter" | grep -q "^${key}"; then
                  echo "::error file=$f::frontmatter is missing required key '${key}'"
                  fail=1
                fi
              done
            done
          done
          exit "$fail"

  workflow-render:
    name: workflow-render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Workflow body placeholders map to Claude tokens, body-only, fail-loud on unmapped (#16)
        run: bash scripts/check-workflow-render.sh

      # Same species as the step above (a lint over the same workflow bodies, ~50ms), so it rides
      # this job rather than spending a whole runner on it.
      - name: No fenced workflow block may assign a zsh-special variable name (#126)
        run: bash scripts/check-workflow-shell.sh

  gate-detector:
    name: gate-detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: repo-root detection surfaces the committed agents.toml gate
        run: |
          set -uo pipefail
          # The generic empty-ecosystem no-op (detect emits nothing) is covered by
          # check-gates.sh, run in this same job below — so it isn't repeated here. This step
          # asserts what is specific to THIS repo: the dogfooded agents.toml [gates] override
          # (#7) must keep being exercised, so CI can't silently stop testing the manifest.
          want="$(printf 'test\tbash scripts/selfcheck.sh')"
          got="$(bash scripts/lib/project-gates.sh detect . 2>/dev/null)"   # compare stdout only
          if [ "$got" != "$want" ]; then
            echo "::error::expected repo-root 'detect .' to emit the committed test gate; got: $got"
            exit 1
          fi

      - name: badcmd must exit non-zero (usage guard)
        run: |
          set -uo pipefail
          rc=0
          bash scripts/lib/project-gates.sh badcmd >/tmp/adb-badcmd.log 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::'project-gates.sh badcmd' unexpectedly exited 0; expected a non-zero usage-error exit"
            cat /tmp/adb-badcmd.log
            exit 1
          fi

      - name: Install jq
        # jq drives exact package.json script detection; install it explicitly (rather
        # than lean on runner-image contents) so the jq-path tests actually exercise it.
        run: sudo apt-get install -y jq

      - name: Full gate-model behavior tests (detection, open set, N/A, path scope)
        run: bash scripts/check-gates.sh

  common-lib:
    name: common-lib
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit-test the shared shell primitives (incl. adb_repo_shape, #23)
        run: bash scripts/check-common-lib.sh

  agent-init:
    name: agent-init
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: agent-init repo-shape tolerance — subdir, untracked parent, nested, non-git (#23)
        run: bash scripts/check-agent-init.sh

  role-dispatch:
    name: role-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit-test the runtime role-dispatch helper (#15)
        run: bash scripts/check-role-dispatch.sh

  pr-review:
    name: pr-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit-test the pre-arm review guard (#134)
        run: bash scripts/check-pr-review.sh

  pr-watch:
    name: pr-watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit-test the async-reviewer status detector (#49)
        run: bash scripts/check-pr-watch.sh

  state-assert:
    name: state-assert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit-test the observe-and-render state helper (#138)
        run: bash scripts/check-state-assert.sh

  skill-compose:
    name: skill-compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Partial skill override composer — ops, inherit-on-recompose, currency, guards (#22)
        run: bash scripts/check-skill-compose.sh

  cleanup-enum:
    name: cleanup-enum
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: /cleanup remote enumeration must exclude the origin/HEAD symref (#38)
        run: bash scripts/check-cleanup-enum.sh

      - name: Install jq
        # cleanup-lib.sh reads merged-PR evidence and run markers with jq; install it explicitly
        # rather than lean on runner-image contents, like the other jq-dependent jobs.
        run: sudo apt-get install -y jq

      - name: /cleanup predicates — squash-merge detection, destructive refusals, terse output (#106, #84)
        run: bash scripts/check-cleanup.sh

  roadmap:
    name: roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        # roadmap-lib.sh parses the gh PR JSON with jq; install it explicitly rather than
        # lean on runner-image contents, like the other jq-dependent jobs.
        run: sudo apt-get install -y jq

      - name: /roadmap predicates — in-flight targeting (#69) + release readiness, offline (#45)
        run: bash scripts/check-roadmap.sh

  roadmap-e2e:
    name: roadmap-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        # The stub gh applies the workflow's own --jq filters with real jq, so a snippet whose
        # filter is wrong fails here rather than at /roadmap time.
        run: sudo apt-get install -y jq

      - name: /roadmap mocked-gh harness — execute the documented snippets offline (#75)
        run: bash scripts/check-roadmap-e2e.sh

  release-convention:
    name: release-convention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release-goal convention helper — dispatch, arg-parsing, fail-loud gh guard (#27)
        run: bash scripts/check-release-convention.sh

  repo-settings:
    name: repo-settings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        # repo-settings.sh builds its protection bodies with jq, and the stub-backed tests read
        # them back with it; install it explicitly rather than lean on runner-image contents.
        run: sudo apt-get install -y jq

      - name: Repo settings — check discovery + write ordering + the automerge-ok table (#87)
        run: bash scripts/check-repo-settings.sh

      # The LIVE half of #122, and the only step in this file that talks to the API. Why it rides
      # this job rather than taking its own, and why it reads the ordinary branch endpoint rather
      # than /protection: docs/repo-settings.md, "Catching the drift early".
      #
      # Local to CI, and stated nowhere else:
      #
      #   * a FORK PR's GITHUB_TOKEN is read-only but still carries the contents:read this needs,
      #     so the read succeeds there too — that path runs in the base repo's context and is fine;
      #   * the `if` is not belt-and-braces. On a PUSH to a fork (a contributor who forked and
      #     enabled Actions), `gh api repos/{owner}/{repo}` resolves to the FORK, whose default
      #     branch has no protection — so the step would exit 14 and hand that contributor a red
      #     build with a remedy only this repo's admin can run. The assertion is about THIS repo's
      #     settings, so it only runs here.
      #
      #   * the event filter is not tidiness either. `push:` here is unfiltered (#99), so this
      #     step would otherwise run for TAGS and maintenance branches — which check out the
      #     PUSHED ref's workflow definitions while the live contexts always come from the
      #     CURRENT default branch. Rename a job, prune the old context on the default branch,
      #     then push a tag whose tree still carries the old name: exit 14, failing release CI
      #     over a comparison that was never meaningful for that ref.
      - name: Required-check drift — a discovered job must not silently stay non-required (#122)
        if: >-
          github.repository == 'BWBama85/ai-dev-baseline'
          && (github.event_name == 'pull_request'
              || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/lib/repo-settings.sh required-drift

  baseline:
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: End-to-end test bin/baseline currency classification
        run: bash scripts/check-baseline.sh

  session-currency:
    name: session-currency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        # The hook emits its one line as structured JSON, and the test asserts on it.
        run: sudo apt-get install -y jq

      - name: SessionStart currency hook — source gate, two-clone split, safety, wiring (#36)
        run: bash scripts/check-session-currency.sh

  precommit-gate:
    name: precommit-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop-hook quality gate must fail loud on a missing library (#35)
        run: bash scripts/check-precommit-gate.sh

  implement-gate:
    name: implement-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        # The implement-issue gate parses gh JSON with jq; install it explicitly.
        run: sudo apt-get install -y jq

      - name: implement-issue Stop hook re-verifies PR state live + fails closed (#44)
        run: bash scripts/check-implement-gate.sh

  install-migration:
    name: install-migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # fetch-depth: 0 → full history + origin/<default>, so the merge-base the pull
        # simulation installs from is present (a shallow clone has no merge-base).
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A plain `git pull` must never dangle an installed symlink (#35)
        run: bash scripts/check-install-migration.sh

  install-guard:
    name: install-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: A missing manifest source must make install.sh fail loud (#48)
        run: bash scripts/check-install-guard.sh

  fact-drift:
    name: fact-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonical facts must be consistent across their consumer docs
        run: bash scripts/check-fact-drift.sh

      # The negative half of that lint fails SILENTLY: an `absent:` pattern matching nothing passes
      # forever while checking nothing (#173, #213). Inject each rule's declared `fires:` witnesses
      # into a COPY of every file it pins and require the real lint to come back red. Steps of the
      # SAME job rather than new jobs on purpose — a new job is a new check context that branch
      # protection would not require, which `repo-settings.sh required-drift` exists to flag.
      - name: Every absent: pin must be observed FAILING under its own superseded spellings (#213)
        run: bash scripts/check-fact-drift.sh --mutation

      - name: ...and the witness/mutation guard rails must themselves be observed failing (#213)
        run: bash scripts/check-fact-guard.sh

      # Same species as the step above (an allowlisted positive-presence lint over the same doc
      # set, ~50ms), so it rides this job rather than spending a whole runner + checkout on a
      # 21st parallel job.
      - name: Release stays project-owned — no /release skill may ship (#3)
        run: bash scripts/check-release-role.sh

      # The other half of the same decision: #3 says the PROJECT supplies its own release skill,
      # so this repo's copy (.claude/skills/release/) needs a gate too. Rides this job for the
      # same reasons as the step above — same decision family, ~100ms — and deliberately NOT a new
      # job: a newly added job is a newly added non-required context, which is the drift #122
      # exists to catch. Nothing else in the harness reads .claude/skills/, so before this step a
      # green CI said nothing at all about the skill that cuts our releases.
      - name: This project's own /release predicates must hold (D14)
        run: bash scripts/check-release-skill.sh

  practice-index:
    name: practice-index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Every practice must be indexed exactly once in 00-index.md
        run: bash scripts/check-practice-index.sh

  install-dry-run:
    name: install-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point HOME at a fresh temp dir
        # install.sh/uninstall.sh write into $HOME; overriding it keeps the
        # runner's real HOME untouched and every later step in this job sees
        # the same override.
        run: |
          set -euo pipefail
          tmp_home="$RUNNER_TEMP/adb-home"
          mkdir -p "$tmp_home"
          echo "HOME=$tmp_home" >> "$GITHUB_ENV"

      - name: Install jq
        # Preinstalled on ubuntu-latest, but install explicitly (install.sh's
        # hook-wiring step requires it) so this job doesn't silently depend on
        # runner-image contents.
        run: sudo apt-get install -y jq

      - name: Run install.sh for all three agents
        # Install claude + codex + gemini so the adapter paths (which now source the
        # shared scripts/lib/common.sh) are exercised alongside Claude's inline path.
        run: |
          set -euo pipefail
          ./install.sh --agent claude --agent codex --agent gemini

      - name: Assert key symlinks exist and resolve
        run: |
          set -euo pipefail
          for p in \
            "$HOME/.claude/CLAUDE.md" \
            "$HOME/.claude/skills/implement-issue" \
            "$HOME/.claude/scripts/precommit-gate.sh" \
            "$HOME/.claude/scripts/lib/project-gates.sh" \
            "$HOME/.claude/scripts/lib/common.sh" \
            "$HOME/.claude/scripts/lib/role-dispatch.sh" \
            "$HOME/.claude/scripts/lib/skill-compose.sh" \
            "$HOME/.claude/scripts/lib/roadmap-lib.sh" \
            "$HOME/.claude/scripts/lib/cleanup-lib.sh" \
            "$HOME/.claude/scripts/lib/pr-review.sh" \
            "$HOME/.codex/AGENTS.md" \
            "$HOME/.codex/skills/implement-issue" \
            "$HOME/.codex/scripts/lib/project-gates.sh" \
            "$HOME/.codex/scripts/lib/role-dispatch.sh" \
            "$HOME/.codex/scripts/lib/roadmap-lib.sh" \
            "$HOME/.codex/scripts/lib/cleanup-lib.sh" \
            "$HOME/.codex/scripts/lib/pr-review.sh" \
            "$HOME/.gemini/GEMINI.md" \
            "$HOME/.gemini/config/skills/implement-issue" \
            "$HOME/.gemini/scripts/lib/project-gates.sh" \
            "$HOME/.gemini/scripts/lib/role-dispatch.sh" \
            "$HOME/.gemini/scripts/lib/roadmap-lib.sh" \
            "$HOME/.gemini/scripts/lib/cleanup-lib.sh" \
            "$HOME/.gemini/scripts/lib/pr-review.sh"; do
            if [ ! -e "$p" ]; then
              echo "::error::expected path to exist and resolve: $p"
              exit 1
            fi
          done

      - name: Assert Stop hook wired into settings.json
        run: |
          set -euo pipefail
          grep -q 'precommit-gate\.sh' "$HOME/.claude/settings.json"

      - name: Run uninstall.sh for all three agents
        run: |
          set -euo pipefail
          ./uninstall.sh --agent claude --agent codex --agent gemini

      - name: Assert root docs and rendered skills are no longer symlinks
        run: |
          set -euo pipefail
          for p in \
            "$HOME/.claude/CLAUDE.md" \
            "$HOME/.codex/AGENTS.md" \
            "$HOME/.codex/skills/implement-issue" \
            "$HOME/.gemini/GEMINI.md" \
            "$HOME/.gemini/config/skills/implement-issue"; do
            if [ -L "$p" ]; then
              echo "::error::$p is still a symlink after uninstall"
              exit 1
            fi
          done
