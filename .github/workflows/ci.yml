      - name: Checkout
        uses: actions/checkout@v4

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: Install jq
        # The implement-issue gate parses gh JSON with jq; install it explicitly.
        run: sudo apt-get install -y jq

      - name: implement-issue Stop hook re-verifies PR state live + fails closed (#44)
        run: bash scripts/check-implement-gate.sh

  install-migration:
    name: install-migration
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        # fetch-depth: 0 → full history + origin/<default>, so the merge-base the pull
        # simulation installs from is present (a shallow clone has no merge-base).
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      - name: A plain `git pull` must never dangle an installed symlink (#35)
        run: bash scripts/check-install-migration.sh

