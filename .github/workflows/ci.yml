      - name: Install jq
        # cleanup-lib.sh reads merged-PR evidence and run markers with jq; install it explicitly
        # rather than lean on runner-image contents, like the other jq-dependent jobs.
        run: sudo apt-get install -y jq

      # Also home of the #38 remote-enumeration regression: since #372 the suite extracts and
      # executes the workflow's own `remote-enum` block (the standalone check-cleanup-enum.sh it
      # replaced tested a hardcoded copy, so this job's old `cleanup-enum` name retired with it).
      - name: /cleanup predicates — squash-merge detection, destructive refusals, remote enumeration, terse output (#106, #84, #38)
        run: bash scripts/check-cleanup.sh

  roadmap:
    name: roadmap
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
