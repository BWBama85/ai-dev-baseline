name: Mutation nightly

# WHERE THE MUTATION HARNESSES RUN (#441, D91; per-PR half superseded by #456, D126). No `--mutation`
# harness runs per pull request any more: `ci.yml` carries none, and `selfcheck-macos` skips every
# `*-mutation` step. This file is where they run, in three ways:
#
#   - SCHEDULED, daily, every harness against the default branch. A daily ATTEMPT: GitHub documents
#     that a `schedule` may be delayed or dropped under load. Every PR's job summary states the last
#     scheduled run's verdict and age (`scripts/mutation-nightly-status.sh`), and says STALE past 48h.
#   - ON DEMAND, by `workflow_dispatch`: no input runs every harness; `step: <name>` runs exactly
#     that one, on the ref chosen at dispatch. The name is validated by `mutation-gate.sh steps
#     --only` before the matrix exists, so a typo fails the plan job instead of running nothing.
#   - ON A PULL REQUEST LABELLED `run-mutations`: every harness against the PR's HEAD commit (not the
#     merge commit `pull_request` checks out by default). Once per labelling — a later push does not
#     re-run it; remove and re-add the label to run again. `pull_request`, never
#     `pull_request_target`: a fork's code runs with the read-only token, as every other PR check does.
#
# ITS OWN FILE, for the two reasons `wsl-smoke.yml` states (a `schedule:` fires a whole file;
# discovery must not turn anything here into a required context). The label trigger keeps the second
# true: it narrows `pull_request` to `types: [labeled]`, and `repo-settings.sh` discovery skips a
# trigger that lacks both `opened` and `synchronize` — `check-mutation-gate.sh` asks discovery
# itself, rather than trusting this comment.
#
# THE MATRIX IS THE REGISTRY, by construction: the plan job reads it from `selfcheck.sh --list`
# through `mutation-gate.sh steps --matrix`, so no list of harnesses lives in this file to drift.
# `check-mutation-gate.sh` pins that wiring.
#
# A HARNESS TOO BIG FOR ONE JOB IS SHARDED BY ROW (#532, D142). The plan's `SHARDS` names it and a
# count K; the matrix then carries K jobs for it, and job k hands `k/K` to the harness as
# `ADB_MUTATION_SHARD`. Each job scores its own rows against the WHOLE suite, so the daily
# whole-suite answer is unchanged, and the K jobs partition the table: every row is scored by
# exactly one of them. A shard that fails or is cancelled fails the run, as any harness does.
#
# WHO SEES A RED RUN: GitHub sends scheduled-workflow failure notifications to the user who last
# modified the cron line below, PROVIDED that user has Actions notifications enabled — a setting
# this repository cannot read. The `if: failure()` step names the failed harness in the job
# summary, which is the artifact the notification links to. A dispatched or labelled run reports to
# whoever started it, in the run and, for a label, in the PR's checks.
on:
  schedule:
    # Daily, at a minute that is not :00 — GitHub's own guidance: the top of the hour is the
    # contended slot, where a schedule is delayed or dropped.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      step:
        description: 'One *-mutation step to run (empty = every harness)'
        required: false
        default: ''
        type: string
  pull_request:
    # labeled ONLY — see the header: without `opened` and `synchronize` this trigger is not one
    # discovery treats as a required context, and it fires once per labelling, not per push.
    types: [labeled]

permissions:
  contents: read

env:
  # The whole point of this file: the gate is overridden and every harness runs.
  ADB_MUTATION_RUN_ALL: '1'
  # ...and every per-test row is scored against the WHOLE suite, not only its declared block (#468).
  ADB_MUTATION_FULL_SUITE: '1'

jobs:
  # THE PLAN: which harnesses this run carries, read from the registry. Runs on the default branch's
  # schedule, on a dispatch, and on a PR only when the label just added is `run-mutations` (any
  # other label is a no-op run whose matrix job never starts).
  plan:
    name: mutation-nightly (plan)
    runs-on: ubuntu-26.04
    # UPSTREAM ONLY, as `wsl-smoke.yml`: a fork that enables Actions would otherwise run this daily.
    if: >-
      github.repository == 'BWBama85/ai-dev-baseline'
      && (github.event_name != 'pull_request' || github.event.label.name == 'run-mutations')
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The labelled PR's own HEAD, so the registry read is the PR's registry.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}   # row-plan-ref

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      # The input reaches the shell through `env`, never interpolated into the script, and
      # `--only` refuses (2) anything that is not a registered *-mutation step. A dispatch of one
      # sharded step runs all of its shards.
      - name: Read the harness list from the registry
        id: plan
        env:
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.step || '' }}
          # <step>=<shards>, comma-separated: each harness here outgrew one job's bound (#532).
          SHARDS: 'settings-fragment-mutation=3'
        run: |
          set -uo pipefail
          if [ -n "$ONLY" ]; then
            matrix="$(bash scripts/mutation-gate.sh steps --matrix --shards "$SHARDS" --only "$ONLY")" || exit 1
          else
            matrix="$(bash scripts/mutation-gate.sh steps --matrix --shards "$SHARDS")" || exit 1
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'harnesses: %s\n' "$matrix"

  mutation-nightly:
    # An unsharded harness keeps the plain name, which is what `/implement-issue` correlates on.
    name: mutation-nightly (${{ matrix.step }}${{ matrix.shards > 1 && format(', shard {0} of {1}', matrix.shard, matrix.shards) || '' }})
    needs: plan
    runs-on: ubuntu-26.04
    # 360 is GitHub's hosted-job maximum. Unsharded, full-suite `settings-fragment-mutation` ranged
    # 179-316 minutes at 289-294 rows (#532), too close to it; sharded three ways, its slowest shard
    # is MEASUREMENT-PENDING. A harness that nears this bound gets another shard, not a longer one.
    timeout-minutes: 360
    strategy:
      # Every harness reports, whichever fails: a red in one is not a reason to cancel the answer
      # the others were about to give.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # FIRST, before checkout or any bootstrap: whatever bash this runner image gives
      # us, in the log. A later step is what proves it clears the floor; this is what
      # makes an image that silently changed its bash readable rather than mysterious.
      - name: Log this runner's bash
        run: bash --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A labelled PR is tested at its HEAD commit, which is what a reader of the PR means by
          # "this change"; the schedule and a dispatch take the ref the run was started on.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}   # row-harness-ref

      - name: bash floor — prove this job's interpreter clears 5.3 (#257)
        run: bash scripts/check-bash-floor.sh --runtime

      # Through the RUNNER, not by invoking the harness directly: `--only` is how the registry's
      # command for a step is resolved, so this file never carries a second copy of it, and an
      # unknown name is an error rather than a quiet no-op. The override in `env:` is what makes
      # the runner's gate answer RUN; its header line says so.
      - name: Run the harness unconditionally
        run: |
          set -uo pipefail
          bash scripts/selfcheck.sh --only "${{ matrix.step }}" 2>&1 | tee "$RUNNER_TEMP/selfcheck.log"
        env:
          # Each whole-suite pool's workdir runs here (#519): a failed one leaves its verdict stream
          # and every row's output, a passing one removes itself. The upload step below publishes it.
          ADB_MUTATION_ARTIFACTS: ${{ runner.temp }}/mutation-artifacts
          # This job's share of the rows (#532); `1/1` for an unsharded harness is every row.
          ADB_MUTATION_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}

      # A SEPARATE STEP, as in ci.yml's `selfcheck-macos`: a step that is killed never reaches its
      # own trailing code. It never fails the job — it is a reporter.
      - name: Explain a red harness in the job summary
        if: failure()
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/selfcheck.log"
          {
            printf '## %s (shard %s of %s) went RED (%s run)\n\n' "${{ matrix.step }}" "${{ matrix.shard }}" "${{ matrix.shards }}" "${{ github.event_name }}"
            printf 'No harness runs in the per-PR CI (#456); this run is where the red was seen. Diagnose before re-running (base/practices/ci-discipline.md).\n\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$log" ]; then
            bash scripts/selfcheck.sh --summarize "$log" >> "$GITHUB_STEP_SUMMARY" \
              || echo "the digest could not be produced — open the job log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This job failed before the runner produced a captured log — the failure is in an earlier step." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      # THE EVIDENCE OF A FAILED POOL (#519): its verdict stream and every row's output, which the job
      # summary above cannot carry. `failure()` only; `ignore` when the harness kept nothing.
      - name: Upload a failed mutation pool's evidence (#519)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-artifacts-${{ matrix.step }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: ${{ runner.temp }}/mutation-artifacts
          if-no-files-found: ignore
          retention-days: 14
          # A re-run of the job uploads under the same name; without this the upload itself fails.
          overwrite: true
