# ai-dev-baseline — this repo's own agent role manifest (it dogfoods its own tooling).
#
# The framework should set itself up the way it tells users to (#7). These roles are
# the template's effective defaults, made explicit and self-documenting rather than
# inherited from a workstation-specific global manifest.
#
# Agent tokens: claude | codex | gemini

[roles]
primary      = "claude"     # drives /implement-issue. Exactly one agent.
gap_analysis = "codex"      # pre-implementation adversarial pass. "" to skip.
review       = ["codex"]    # code review before merge. 1+ agents; more = better.
                            # CODEX, NOT CLAUDE, AND NOT BY TASTE (#211). `primary` is claude, so
                            # `["claude"]` here was Claude reviewing Claude — five subagent passes
                            # of the model that wrote the diff. Both vendors' published guidance
                            # points the same way: Opus 5's asks that Claude NOT be given explicit
                            # verification scaffolding (it self-corrects natively), and Codex's
                            # asks to be handed exactly the named-checklist, required-vs-optional
                            # pass step 8 now sends it. Measured on the #173 run: the codex pass
                            # found two real defects the driving agent had not; the 22-minute
                            # Claude bug review returned three LOW findings and nothing higher.
debug        = "claude"     # owns root-cause investigations.
# issue_author = "claude"   # defaults to `primary` if unset
release      = "claude"     # Names WHO cuts a release. Declared explicitly (not left to default)
                            # because this repo now HAS a release executor and the skill resolves
                            # this key before it mutates anything. The BASELINE still installs no
                            # `/release` — decision #3/D7, pinned by check-fact-drift.sh. What
                            # this repo supplies is its OWN project-scoped copy at
                            # `.claude/skills/release/SKILL.md` (D14), which is exactly what D7
                            # says every adopting project must do for itself. Setting this to a
                            # token other than `claude` makes that skill STOP and tell you to run
                            # the release from that agent — see docs/roles-and-agents.md.

# This repo IS reviewed by an async external bot — the Codex connector, which posts review
# threads a few minutes after a PR opens. Declaring it here does two things (#134):
#
#   1. `/resolve-pr-threads` may auto-resolve its threads (the original purpose, #26);
#   2. `/implement-issue` step 10 will NOT arm auto-merge until that reviewer has reviewed the
#      PR's current head commit — the guard that PR #133 lacked when it merged 29 seconds after
#      opening and six minutes before this very bot posted five real bugs.
#
# The declaration is what makes (2) possible: an UNDECLARED repo cannot be told apart from one
# with no reviewer at all, so the guard fails closed there rather than guessing. A repo with no
# async reviewer declares `bots = []` and keeps unattended auto-merge.
[reviewers]
bots = ["chatgpt-codex-connector"]

# UNCAPPED RE-REVIEW ROUNDS (#420, D88). `0` is the sentinel meaning "no round ceiling" — the
# resolve loop runs until the reviewer passes or another terminal guard fires, and exit 15 never
# happens. This repo takes that deviation deliberately, on the evidence of PR #429: the loop was
# stopped at the built-in 6 while round 7 was still finding real defects, including a command
# injection introduced by round 5's own fix. A bound that cuts off a productive loop is worse than
# no bound, and picking a bigger number would just be a guess about where to cut it off next time.
#
# WHAT STILL BOUNDS IT, because "no round ceiling" is not "no limits":
#   - one re-review request per (reviewer, head), so a round always costs a head-moving push;
#   - each round's own wait keeps its `--max-secs`;
#   - a round that pushed nothing exits 30 rather than re-finding the same findings;
#   - the receipt read refuses past 100 comments, fail-closed.
#
# WHAT THIS DOES NOT CHANGE: auto-merge is still withheld until a declared reviewer signals a clean
# pass at the current head. An uncapped loop makes that gate MORE important, not less — see #430.
max_rounds = 0

# Repair required-check drift automatically, instead of only detecting it (#333).
#
# THIS REPO IS THE ONE THAT PROVED THE GAP. `6499dfe` added the `adopt` job; `required-drift` fired
# immediately and correctly, named it, and nothing acted — so `main` declared 27 required contexts
# against 28 discovered jobs, stayed red for ~21 hours, and PRs #329 and #330 both merged gated by a
# check set that did not include `adopt`. A signal nothing consumes is not a repair.
#
# With this declared, `/implement-issue` preflight runs `baseline repo reconcile` after it lands on
# a clean, synced default branch — the first moment the fix is both legal and credentialed. It is
# additions-only, it refuses unless HEAD is the default branch's tip, and it verifies the write by
# re-reading. See scripts/lib/repo-settings.sh's cmd_reconcile and D63.
#
# DEFAULT OFF FOR EVERYONE ELSE. This is an unattended write to GitHub branch protection, and
# `/adopt` already treats `baseline repo apply` as consent-gated — so an adopting repo opts in here
# deliberately or not at all. Read from the REPO manifest only, never the global one: a global
# opt-in would arm it in every repository the operator touches.
[repo]
reconcile-required-checks = true

# This repo has no standard-ecosystem toolchain, so `project-gates.sh` auto-detects
# nothing (no pnpm/cargo/go/python). Its real gate is `scripts/selfcheck.sh` — the full
# local CI mirror — so we wire it in explicitly as the `test` gate. Both the skill's
# in-loop gate step and the global precommit Stop-hook then run selfcheck on a feature
# branch, catching a red check in-loop instead of only at CI (#7).
#
# NOTE: selfcheck is a post-commit (pre-push) mirror — its build-drift step compares the
# freshly-built tree against HEAD (committed), exactly as CI does. Commit source and
# generated output together (Golden Rule #1) so the Stop-hook gate — which runs at
# turn-end, after commits — sees a clean tree. See .ai-dev-baseline/decisions.md.
[gates]
test = "bash scripts/selfcheck.sh"

# Cadence: this gate belongs to a FULL run, not to every turn-end (#240).
#
# `selfcheck.sh` is the whole offline CI mirror. Golden rule 3 puts it before every push, and
# that is right; as the `test` axis of a per-turn Stop hook it meant re-running CI after every
# message — minutes, not seconds, and growing as the registry does (see CLAUDE.md golden rule 3
# for the current measured figure). This declaration is what the general fix for that looks like,
# and this repo dogfoods it.
#
# WHAT IT DOES NOT DO, so nobody reads more into it: it does not change this repo's turn-end
# behaviour today. The global gate delegates to `.claude/scripts/precommit-gate.sh` (D25) before
# it ever consults `[gates]`, and that script runs its own fast subset. This line is the correct
# declaration for the general mechanism, and it is what would take effect if the local gate were
# ever removed — enforcement stays cheap by declaration rather than by one repo's private script.
#
# `full` means "excluded from the per-turn hook, included in a full `project-gates.sh run`". It is
# deliberately NOT called "pre-push": nothing in the baseline wires an automatic pre-push hook.
# The workflows call the full runner before they push, so in practice it does run before a
# workflow-driven push — but that is those workflows' doing, not a promise this file can make.
[gates.cadence]
test = "full"

# The three remaining built-in axes have no toolchain in this stdlib-shell repo. Declare
# them Not-Applicable (reported by `project-gates.sh status`, never a failure or a
# detection miss) rather than leaving them to look like detection silently failed.
[gates.state]
typecheck = "na"
lint      = "na"
format    = "na"

# MCP servers this project's agents should expect (#422 gave this key its first consumer).
#
# DECLARATION ONLY — nothing here installs or starts a server. `/implement-issue` step 5b asks the
# agent to put one real read-only query to each entry and adjudicates the result fail-closed: a
# server with no recorded result is reported DEGRADED exactly as a failing one is, so skipping the
# probe cannot buy a clean verdict. A degraded server degrades the run and is named; it does not
# stop it (D90).
#
# context7 is here because this repo writes shell against gh, git and GitHub's GraphQL API, and
# `third-party-claims.md` makes it the required first documentation source for all three.
[mcp]
required = ["context7"]
optional = []
